# Refer [https://docs.rs/sqlx/latest/sqlx/_config/_reference/index.html]
[common]
database-url-var = "DATABASE_URL"

[migrate]
migrations-dir = "migrations"

[migrate.defaults]
migration-type = "simple"
migration-versioning = "sequential"

# Table 'files'
[macros.table-overrides.'files']
'object_key' = "uuid::Uuid"
'created_at' = "chrono::NaiveDateTime"
'updated_at' = "chrono::NaiveDateTime"

# Table 'folders'
[macros.table-overrides.'folders']
'created_at' = "chrono::NaiveDateTime"
'updated_at' = "chrono::NaiveDateTime"