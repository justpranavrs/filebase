name: Feature Request
description: Suggest an idea or enhancement for Filebase
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an enhancement! Please check existing issues and roadmap items in `CHANGELOG.md` before submitting.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem, limitation, or friction in using Filebase?
      placeholder: A clear description of the problem (e.g. "I find it difficult to...")
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or behavior you would like to see implemented.
      placeholder: A clear description of how the feature should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions, tools, or workarounds you have considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or extra context about the feature request.
    validations:
      required: false
