name: "filebase"

services:
  filebase:
    build: .
    image: ${APP_NAME:-filebase}
    container_name: ${APP_NAME:-filebase}-server
    # ports:
    #   - "${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    env_file:
      - .env.docker
    volumes:
      - ${DATA_DIR:-./.data}:/var/lib/filebase/data
      - ${STORAGE_DIR:-./storage}:/var/lib/filebase/storage
    restart: unless-stopped

  backups:
    build: ./backup
    image: ${APP_NAME:-filebase}-backup
    container_name: ${APP_NAME:-filebase}-backup
    environment:
      - AGE_DAYS=7
      - INTERVAL_SECONDS=3600
      - TIMEOUT_MILLISECONDS=10000
    volumes:
      - ${DATA_DIR:-./.data}:/var/lib/filebase/data
      - ${DATABASE_BACKUP:-./.backups}:/var/lib/filebase/backups
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: ${APP_NAME:-filebase}-nginx
    container_name: ${APP_NAME:-filebase}-nginx
    ports:
      - "${REVERSE_PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STORAGE_DIR:-./storage}:/var/lib/filebase/storage:ro
    restart: unless-stopped
