name: "filebase"

services:
  filebase:
    build: .
    image: ${IMAGE_NAME:-filebase}:${VERSION:-0.1.0-alpha}
    container_name: filebase-server
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    env_file:
      - .env.docker
    volumes:
      - ${DATA_DIR:-./.data}:/var/lib/filebase/data
      - ${STORAGE_DIR:-./.storage}:/var/lib/filebase/storage
    restart: unless-stopped

  backups:
    build: ./backup
    image: ${IMAGE_NAME:-filebase}:backup-${VERSION:-0.1.0-alpha}
    container_name: filebase-backup
    environment:
      - AGE_DAYS=7
      - INTERVAL_SECONDS=3600
      - TIMEOUT_MILLISECONDS=10000
    volumes:
      - ${DATA_DIR:-./.data}:/var/lib/filebase/data
      - ${DATABASE_BACKUP:-./.backups}:/var/lib/filebase/backups
    restart: unless-stopped
