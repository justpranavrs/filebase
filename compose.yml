name: "filebase"

services:
  filebase:
    image: ${APP_NAME:-filebase}
    container_name: ${APP_NAME:-filebase}-server
    ports:
      - "${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    env_file:
      - .env
    volumes:
      - db-data:/app/${DATA_DIR:-.data}
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully

  migrations:
    build: .
    image: ${APP_NAME:-filebase}
    command: ["./filebase", "--migrate-only"]
    container_name: ${APP_NAME:-filebase}-migrations
    env_file:
      - .env
    volumes:
      - db-data:/app/${DATA_DIR:-.data}

  backup:
    build: ./backup
    image: ${APP_NAME:-filebase}-backup
    container_name: ${APP_NAME:-filebase}-backup
    environment:
      - DB_PATH=/var/lib/filebase/data/filebase.db
      - DB_BACKUP_PATH=/var/lib/filebase/backups
      - AGE_DAYS=7
      - INTERVAL_SECONDS=3600
      - TIMEOUT_MILLISECONDS=10000
    volumes:
      - db-data:/var/lib/filebase/data
      - db-backups:/var/lib/filebase/backups
    restart: unless-stopped

volumes:
  db-data:
    name: ${APP_NAME:-filebase}-data
  db-backups:
    name: ${APP_NAME:-filebase}-backups
    external: true