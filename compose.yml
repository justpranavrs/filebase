name: "filebase"

services:
  filebase:
    build: .
    image: ${IMAGE_NAME:-filebase}:${VERSION:-0.1.0-alpha}
    container_name: filebase-server
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
      - DATABASE_URL=sqlite:/var/lib/filebase/data/filebase.db
      - STORAGE_DIR=/var/lib/filebase/storage
      - SERVER_TIMEOUT_SECONDS=${SERVER_TIMEOUT_SECONDS:-30}
      - DATABASE_MAX_CONNECTIONS=${DATABASE_MAX_CONNECTIONS:-10}
      - DATABASE_TIMEOUT_SECONDS=${DATABASE_TIMEOUT_SECONDS:-15}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ${DATA_DIR:-./.data}:/var/lib/filebase/data
      - ${STORAGE_DIR:-./.storage}:/var/lib/filebase/storage
    restart: unless-stopped

  backups:
    build: ./backup
    image: ${IMAGE_NAME:-filebase}-backup:${VERSION:-0.1.0-alpha}
    container_name: filebase-backup
    environment:
      - AGE_DAYS=7
      - INTERVAL_SECONDS=3600
      - TIMEOUT_MILLISECONDS=10000
    volumes:
      - ${DATA_DIR:-./.data}:/var/lib/filebase/data
      - ${DATABASE_BACKUP:-./.backups}:/var/lib/filebase/backups
    restart: unless-stopped
