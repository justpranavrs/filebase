client_max_body_size 1G;

# Static Files
location /static/ {
    alias /srv/filebase/static/;
    expires 30d;
}

# Filebase Storage
location /storage/ {
    internal;
    alias /var/lib/filebase/storage/;
}

# Application
location / {
    proxy_pass http://filebase;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
