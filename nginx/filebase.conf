# Robots Exclusion
location = /robots.txt {
    alias /srv/filebase/static/robots.txt;
    access_log off;
}

# Favicon
location = /favicon.ico {
    alias /srv/filebase/static/favicon.svg;
    access_log off;
}

# Static Files
location /static/ {
    alias /srv/filebase/static/;
    expires 30d;
}

# Filebase Storage
location /storage/ {
    internal;
    alias /var/lib/filebase/storage/;
}

# Application
location / {
    proxy_pass http://filebase;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
